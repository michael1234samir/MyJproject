<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Glowing Coptic Cross from the header of Login Screen -->
  <defs>
    <radialGradient id="crossGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crossGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <circle cx="24" cy="24" r="22" fill="url(#crossGlow)"/>
  <!-- Vertical Beam -->
  <rect x="22" y="6" width="4" height="36" rx="2" fill="url(#crossGold)"/>
  <!-- Horizontal Beam -->
  <rect x="10" y="16" width="28" height="4" rx="2" fill="url(#crossGold)"/>
  <!-- Center rosette ring -->
  <circle cx="24" cy="18" r="4.5" stroke="#FEF08A" stroke-width="1.5" fill="none"/>
  <circle cx="24" cy="18" r="2" fill="#FEF08A"/>
  <!-- End trefoil dots -->
  <circle cx="24" cy="6" r="1.5" fill="#FEF08A"/>
  <circle cx="24" cy="42" r="1.5" fill="#FEF08A"/>
  <circle cx="10" cy="18" r="1.5" fill="#FEF08A"/>
  <circle cx="38" cy="18" r="1.5" fill="#FEF08A"/>
</svg>
